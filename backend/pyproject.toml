[project]
name = "eldercare-api"
version = "1.0.0"
description = "ElderCare: shared elderly healthcare and medication management API"
requires-python = ">=3.12"
# Core: everything the API needs to serve requests. Kept small because serverless hosts
# (Vercel) install it on cold start.
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.36",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
    "fpdf2>=2.8",
    "tzdata>=2024.2",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
]

[project.optional-dependencies]
# Long-running server and migrations (Docker / Cloud Run / local development).
server = ["uvicorn[standard]>=0.32", "alembic>=1.14"]
# Google Cloud: Cloud Scheduler OIDC verification, Vertex AI auth, Cloud Storage documents.
gcp = ["google-auth>=2.36", "google-cloud-storage>=2.18"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F/W: pycodestyle+pyflakes, I: isort, B: bugbear, UP: pyupgrade, S: bandit security rules,
# SIM: simplifications, RUF: ruff-specific, DTZ: naive-datetime bugs, C4/PIE/RET/PERF/FURB:
# idiomatic and efficient constructs, ARG: unused arguments.
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "DTZ", "C4", "PIE", "RET", "PERF", "FURB", "ARG"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "ARG"]  # fixtures are often used for side effects  # asserts and literal test passwords are expected in tests
"alembic/**" = ["E501"]
"app/services/email.py" = ["E501"]  # inline-styled HTML email template

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["fpdf.*", "google.*"]
ignore_missing_imports = true

[tool.pyright]
# Same checker the VS Code Python extension (Pylance) uses, so editors show no problems.
venvPath = "."
venv = ".venv"
include = ["app", "tests", "alembic", "scripts"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
